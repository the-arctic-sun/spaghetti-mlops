name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set image tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile \
          -t ${{ secrets.DOCKER_USERNAME }}/spaghetti-mlops:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/spaghetti-mlops:${{ steps.vars.outputs.TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/spaghetti-mlops:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/spaghetti-mlops:${{ steps.vars.outputs.TAG }}
